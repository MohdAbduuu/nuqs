<!-- Searchable check library cards rendered by Go html/template. -->
{{if .}}{{range .}}<a class="checkCard" href="/checks/{{.ID}}">
  <span class="badge {{badgeClass .Severity}}">{{.Severity}}</span>
  <h3>{{.Title}}</h3>
  <p class="checkSummary">{{firstLine .Description}}</p>
</a>{{end}}{{else}}<p class="emptyRow">No matching checks.</p>{{end}}
