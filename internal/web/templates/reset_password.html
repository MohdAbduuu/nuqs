<!-- Set or reset a user's password with a one-time code from an admin or the server CLI. -->
{{define "auth_content"}}
<form method="POST" action="/reset-password" class="authForm">
  <label class="field">Username
    <input name="username" value="{{.Username}}" required autocomplete="username" spellcheck="false"{{if not .Username}} autofocus{{end}}>
  </label>
  <label class="field">One-time reset code
    <input name="code" class="mono" value="{{.Code}}" required autocomplete="one-time-code" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX"{{if .Username}} autofocus{{end}}>
    <small>Ask an admin to reset your password, or run <code>nuqs user reset-password &lt;name&gt;</code> on the server.</small>
  </label>
  <label class="field">New password
    <input name="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password">
    <small>At least 10 characters.</small>
  </label>
  <label class="field">Confirm new password
    <input name="confirm" type="password" required minlength="10" maxlength="128" autocomplete="new-password">
  </label>
  <button type="submit" class="primary authSubmit">Save password</button>
</form>
<p class="authFoot"><a href="/login">Back to sign in</a></p>
{{end}}
