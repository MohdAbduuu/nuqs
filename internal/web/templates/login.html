<!-- Sign-in screen for existing Nuqs accounts. -->
{{define "auth_content"}}
<form method="POST" action="/login" class="authForm">
  <input type="hidden" name="next" value="{{.Next}}">
  <label class="field">Username
    <input name="username" value="{{.Username}}" required autocomplete="username" spellcheck="false" autofocus>
  </label>
  <label class="field">Password
    <input name="password" type="password" required autocomplete="current-password">
  </label>
  <button type="submit" class="primary authSubmit">Sign in</button>
</form>
<p class="authFoot"><a href="/reset-password">Forgot password or have a one-time code?</a></p>
{{end}}
