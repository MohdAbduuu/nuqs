<!-- Standalone frame for setup, sign-in and password reset pages without workspace chrome. -->
{{define "auth_layout"}}<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/static/nuqs-logo.png" type="image/png">
<title>{{.Title}} · Nuqs</title>
<link rel="stylesheet" href="/static/nuqs.css?v={{.Version}}">
<script defer src="/static/app.js?v={{.Version}}"></script>
</head>
<body class="authBody">
<div class="authTop">
  <button id="themeToggle" type="button" class="iconButton" aria-label="Switch to light mode" title="Switch to light mode" aria-pressed="true">
    <svg class="iconSun" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
    <svg class="iconMoon" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14a8.4 8.4 0 0 1-10-10 8.5 8.5 0 1 0 10 10Z"/></svg>
  </button>
</div>
<main class="authShell">
  <section class="card authCard">
    <div class="authBrand">
      <img class="brand" src="/static/nuqs-logo.png" width="44" height="44" alt="Nuqs">
      <div>
        <h1>{{.Heading}}</h1>
        {{if .Subtitle}}<p class="subtle">{{.Subtitle}}</p>{{end}}
      </div>
    </div>
    {{if .Notice}}<p class="noticeCard" role="status">{{.Notice}}</p>{{end}}
    {{if .Error}}<p class="formError" role="alert">{{.Error}}</p>{{end}}
    {{template "auth_content" .}}
  </section>
</main>
</body></html>{{end}}
